<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>금별맥주 테이블 QR 인쇄</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
        background: #e9e9e9;
        color: #222;
    }

    /* ===== 조작 패널 (인쇄 시 숨김) ===== */
    .panel {
        position: sticky; top: 0; z-index: 10;
        background: #1f1f1f; color: #fff;
        padding: 14px 16px;
        display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;
        box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    .panel h1 { font-size: 18px; width: 100%; }
    .field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
    .field input, .field select {
        padding: 8px 10px; font-size: 15px; border-radius: 6px; border: 1px solid #555;
        background: #2d2d2d; color: #fff; min-width: 90px;
    }
    .btn {
        padding: 10px 18px; font-size: 15px; font-weight: bold;
        border: none; border-radius: 6px; cursor: pointer;
    }
    .btn-make { background: #444; color: #fff; }
    .btn-print { background: #d32f2f; color: #fff; }
    .info { font-size: 13px; color: #bbb; width: 100%; }

    /* ===== A4 페이지 ===== */
    .pages { padding: 20px 0 60px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .page {
        width: 210mm; height: 297mm;
        background: #fff;
        padding: 10mm;
        display: grid;
        gap: 6mm;
        box-shadow: 0 2px 10px rgba(0,0,0,.15);
    }
    .layout-2  { grid-template-columns: 1fr;        grid-template-rows: repeat(2, 1fr); }
    .layout-4  { grid-template-columns: repeat(2,1fr); grid-template-rows: repeat(2, 1fr); }
    .layout-6  { grid-template-columns: repeat(2,1fr); grid-template-rows: repeat(3, 1fr); }
    .layout-12 { grid-template-columns: repeat(3,1fr); grid-template-rows: repeat(4, 1fr); }

    /* ===== QR 카드 ===== */
    .card {
        border: 1.5mm solid #d32f2f;
        border-radius: 4mm;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center;
        overflow: hidden;
    }
    .card .brand { font-weight: 800; color: #d32f2f; }
    .card .table-no { font-weight: 900; line-height: 1; }
    .card .qr img, .card .qr canvas { display: block; width: 100% !important; height: auto !important; }
    .card .guide { color: #444; }

    /* 레이아웃별 크기 */
    .layout-2  .brand { font-size: 12mm; } .layout-2  .table-no { font-size: 26mm; margin: 3mm 0 5mm; } .layout-2  .qr { width: 70mm; } .layout-2  .guide { font-size: 7mm; margin-top: 4mm; }
    .layout-4  .brand { font-size: 8mm;  } .layout-4  .table-no { font-size: 17mm; margin: 2mm 0 4mm; } .layout-4  .qr { width: 55mm; } .layout-4  .guide { font-size: 4.5mm; margin-top: 3mm; }
    .layout-6  .brand { font-size: 6mm;  } .layout-6  .table-no { font-size: 13mm; margin: 1mm 0 3mm; } .layout-6  .qr { width: 42mm; } .layout-6  .guide { font-size: 3.8mm; margin-top: 2mm; }
    .layout-12 .brand { font-size: 4mm;  } .layout-12 .table-no { font-size: 9mm;  margin: 1mm 0 2mm; } .layout-12 .qr { width: 32mm; } .layout-12 .guide { font-size: 2.8mm; margin-top: 1.5mm; }

    /* ===== 인쇄 설정 ===== */
    @page { size: A4; margin: 0; }
    @media print {
        body { background: #fff; }
        .panel { display: none; }
        .pages { padding: 0; gap: 0; }
        .page { box-shadow: none; page-break-after: always; break-after: page; }
        .page:last-child { page-break-after: auto; break-after: auto; }
        .card { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }

    /* 휴대폰 화면에서 미리보기 축소 */
    @media screen and (max-width: 820px) {
        .pages { zoom: 0.45; }
    }
</style>
</head>
<body>

<div class="panel">
    <h1>🍺 금별맥주 테이블 QR 인쇄</h1>
    <div class="field">
        <label>시작 번호</label>
        <input type="number" id="start" value="1" min="1" max="999">
    </div>
    <div class="field">
        <label>끝 번호</label>
        <input type="number" id="end" value="100" min="1" max="999">
    </div>
    <div class="field">
        <label>한 장에 몇 개</label>
        <select id="perPage">
            <option value="2">2개 (크게)</option>
            <option value="4" selected>4개</option>
            <option value="6">6개</option>
            <option value="12">12개 (작게)</option>
        </select>
    </div>
    <button class="btn btn-make" onclick="build()">미리보기 만들기</button>
    <button class="btn btn-print" onclick="window.print()">🖨️ 인쇄</button>
    <div class="info" id="info"></div>
</div>

<div class="pages" id="pages"></div>

<script>
    const BASE_URL = 'https://andone-order.com/?table=';

    function build() {
        let start = parseInt(document.getElementById('start').value, 10);
        let end = parseInt(document.getElementById('end').value, 10);
        const perPage = parseInt(document.getElementById('perPage').value, 10);

        if (!Number.isFinite(start) || start < 1) start = 1;
        if (!Number.isFinite(end) || end < start) end = start;
        if (end - start > 499) end = start + 499;

        const pagesEl = document.getElementById('pages');
        pagesEl.innerHTML = '';

        const total = end - start + 1;
        const pageCount = Math.ceil(total / perPage);
        document.getElementById('info').textContent =
            `${start}번 ~ ${end}번 · 총 ${total}개 · A4 ${pageCount}장 · 주소: ${BASE_URL}번호`;

        let page = null;
        for (let n = start; n <= end; n++) {
            if ((n - start) % perPage === 0) {
                page = document.createElement('div');
                page.className = `page layout-${perPage}`;
                pagesEl.appendChild(page);
            }

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="brand">금별맥주</div>
                <div class="table-no">${n}번</div>
                <div class="qr" id="qr-${n}"></div>
                <div class="guide">QR을 찍고 주문해 주세요</div>
            `;
            page.appendChild(card);

            new QRCode(document.getElementById(`qr-${n}`), {
                text: BASE_URL + n,
                width: 512,
                height: 512,
                colorDark: '#000000',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.M
            });
        }

        // 빈칸 채우기 (마지막 장 칸 모양 유지)
        const remain = (perPage - (total % perPage)) % perPage;
        for (let i = 0; i < remain; i++) {
            const blank = document.createElement('div');
            page.appendChild(blank);
        }
    }

    build();
</script>
</body>
</html>
